[package]
name = "rcp"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.8", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
humansize = "2.1.3"
ignore = "0.4.34"
nucleo = "0.5.0"
ratatui = "0.30.2"
rpassword = "7.5.5"
serde_json = "1.0.154"
shell-escape = "0.1.5"
ssh2 = { version = "0.9.7", features = ["vendored-openssl"] }
ssh2-config = "0.9.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
